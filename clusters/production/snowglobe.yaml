# Flux GitOps wiring for Snowglobe.
#
# Apply these to the cluster once (they live in Git so Flux self-manages them
# after a `flux bootstrap`). Flux then watches this repo and reconciles ./deploy.
#
# Adjust the `url` to your actual GitHub owner. The repo is public, so no
# secretRef is needed for read access; add one (a deploy key) if you make it
# private.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: snowglobe
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/jsam0418/snowglobe
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snowglobe
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: snowglobe
  path: ./deploy
  prune: true
  wait: true
  timeout: 5m
