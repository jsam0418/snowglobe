# Exposes the WebSocket server at https://game.josiahsam.com.
# Assumes an ingress controller + cert-manager — adjust ingressClassName, the
# issuer annotation, and TLS to match your cluster (or delete this file if you
# terminate TLS elsewhere).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snowglobe
  namespace: snowglobe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Keep long-lived WebSocket connections from being reaped by the proxy.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - game.josiahsam.com
      secretName: snowglobe-tls
  rules:
    - host: game.josiahsam.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snowglobe
                port:
                  number: 80
